<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proxy Hub</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      background: #0f1117;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #f0f6fc;
      overflow: hidden;
    }
    #top-bar {
      background: #161b22;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 15px;
      border-bottom: 1px solid #30363d;
      flex-shrink: 0;
    }
    h1 {
      margin: 0;
      font-size: 18px;
      color: #58a6ff;
      font-weight: 600;
    }
    #search-form {
      flex-grow: 1;
      max-width: 600px;
    }
    input {
      width: 100%;
      padding: 8px 14px;
      border-radius: 6px;
      border: 1px solid #30363d;
      background: #0d1117;
      color: #f0f6fc;
      font-size: 14px;
      outline: none;
    }
    input:focus {
      border-color: #58a6ff;
    }
    #status {
      font-size: 12px;
      color: #8b949e;
      margin-left: auto;
    }
    iframe {
      flex-grow: 1;
      border: none;
      width: 100%;
      height: 100%;
      background: #ffffff;
    }
  </style>
</head>
<body>

  <div id="top-bar">
    <h1>Proxy</h1>
    <form id="search-form" onsubmit="loadURL(event)">
      <input type="text" id="url-input" placeholder="Type a website URL (e.g. https://google.com)..." autocomplete="off" autofocus>
    </form>
    <div id="status">Online</div>
  </div>

  <iframe id="proxy-frame"></iframe>

  <script>
    const input = document.getElementById('url-input');
    const frame = document.getElementById('proxy-frame');
    const status = document.getElementById('status');

    function loadURL(e) {
      if (e) e.preventDefault();
      let val = input.value.trim();
      if (!val) return;

      status.innerText = "Loading...";

      let targetUrl = val;
      if (!val.startsWith('http://') && !val.startsWith('https://')) {
        if (val.includes('.') && !val.includes(' ')) {
          targetUrl = 'https://' + val;
        } else {
          targetUrl = 'https://www.google.com/search?q=' + encodeURIComponent(val);
        }
      }

      // Direct secure embedding via public proxy gateway to eliminate service worker path errors
      frame.src = 'https://api.allorigins.win/raw?url=' + encodeURIComponent(targetUrl);
      
      frame.onload = () => {
        status.innerText = "Connected";
      };
      frame.onerror = () => {
        status.innerText = "Load failed";
      };
    }
  </script>

</body>
</html>
