<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browser Hub - S++++ Tier Ultimate Edition</title>
  
  <!-- Ultraviolet Core Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/@titaniumnetwork-dev/ultraviolet@3.2.7/dist/uv.bundle.js"></script>

  <script>
    // GitHub Pages Subpath Auto-Resolver
    const pathSegments = window.location.pathname.split('/').filter(Boolean);
    const repoSubpath = (window.location.hostname.includes('github.io') && pathSegments.length > 0) 
      ? '/' + pathSegments[0] + '/' 
      : '/';

    // Global Ultraviolet Configuration
    window.__uv$config = {
      prefix: repoSubpath + 'uv/service/',
      bare: 'https://bare-server-y5ch.onrender.com/bare/',
      encodeUrl: Ultraviolet.codec.xor.encode,
      decodeUrl: Ultraviolet.codec.xor.decode,
      handler: 'https://cdn.jsdelivr.net/npm/@titaniumnetwork-dev/ultraviolet@3.2.7/dist/uv.handler.js',
      client: 'https://cdn.jsdelivr.net/npm/@titaniumnetwork-dev/ultraviolet@3.2.7/dist/uv.client.js',
      bundle: 'https://cdn.jsdelivr.net/npm/@titaniumnetwork-dev/ultraviolet@3.2.7/dist/uv.bundle.js',
      config: repoSubpath + 'uv.config.js',
      sw: repoSubpath + 'sw.js',
    };
  </script>

  <style>
    :root {
      --bg-darkest: #07090e;
      --bg-header: #0f1319;
      --bg-bar: #161b22;
      --bg-input: #0d1117;
      --bg-hover: #21262d;
      --accent: #388bfd;
      --accent-glow: rgba(56, 139, 253, 0.25);
      --border: #30363d;
      --text-main: #f0f6fc;
      --text-muted: #8b949e;
      --green: #3fb950;
      --yellow: #d29922;
      --red: #f85149;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100vw;
      height: 100vh;
      background: var(--bg-darkest);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, sans-serif;
      color: var(--text-main);
      overflow: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    /* ==========================================
       ANTI-NESTING / ANTI-STACKING CSS RULE
       ========================================== */
    body.is-nested-frame #browser-app-header {
      display: none !important;
    }
    body.is-nested-frame #viewport-container {
      height: 100vh !important;
    }

    /* --- BROWSER HEADER & TABS --- */
    #browser-app-header {
      background: var(--bg-header);
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      user-select: none;
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
      z-index: 100;
    }

    #tab-strip {
      display: flex;
      align-items: center;
      background: var(--bg-darkest);
      padding: 6px 10px 0 10px;
      gap: 6px;
      overflow-x: auto;
    }

    #tab-strip::-webkit-scrollbar { height: 3px; }
    #tab-strip::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    .browser-tab {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--bg-header);
      border: 1px solid var(--border);
      border-bottom: none;
      padding: 7px 14px;
      border-radius: 8px 8px 0 0;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-muted);
      cursor: pointer;
      max-width: 200px;
      min-width: 120px;
      transition: all 0.15s ease-in-out;
      position: relative;
    }

    .browser-tab:hover {
      background: var(--bg-bar);
      color: var(--text-main);
    }

    .browser-tab.active-tab {
      background: var(--bg-bar);
      color: var(--text-main);
      border-color: var(--border);
      border-bottom: 2px solid var(--accent);
      font-weight: 600;
    }

    .tab-icon {
      font-size: 12px;
      opacity: 0.7;
    }

    .tab-title-text {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex-grow: 1;
    }

    .tab-close-btn {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      color: var(--text-muted);
      transition: all 0.15s;
    }

    .tab-close-btn:hover {
      background: rgba(248, 81, 73, 0.2);
      color: var(--red);
    }

    #add-tab-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 18px;
      padding: 4px 10px;
      cursor: pointer;
      border-radius: 6px;
      transition: all 0.15s;
    }

    #add-tab-btn:hover {
      background: var(--bg-hover);
      color: var(--text-main);
    }

    /* --- OMNIBOX & NAVIGATION CONTROL BAR --- */
    #nav-controls-bar {
      background: var(--bg-bar);
      padding: 8px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .nav-btn {
      background: var(--bg-input);
      border: 1px solid var(--border);
      color: var(--text-main);
      width: 32px;
      height: 32px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      transition: all 0.15s;
    }

    .nav-btn:hover {
      background: var(--bg-hover);
      border-color: var(--text-muted);
    }

    #omnibox-form {
      flex-grow: 1;
      display: flex;
    }

    #omnibox-input {
      width: 100%;
      height: 34px;
      padding: 0 14px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--bg-input);
      color: var(--text-main);
      outline: none;
      font-size: 13.5px;
      transition: all 0.2s ease;
    }

    #omnibox-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    #status-pill {
      font-size: 11px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 12px;
      background: var(--bg-input);
      border: 1px solid var(--border);
      color: var(--text-muted);
      white-space: nowrap;
    }

    /* --- SPEED DIAL BOOKMARKS BAR --- */
    #quick-bookmarks {
      background: var(--bg-bar);
      padding: 2px 14px 8px 14px;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      border-bottom: 1px solid var(--border);
    }

    .bookmark-btn {
      background: var(--bg-input);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 4px 12px;
      border-radius: 14px;
      font-size: 11.5px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .bookmark-btn:hover {
      color: var(--text-main);
      border-color: var(--accent);
      background: var(--bg-hover);
      transform: translateY(-1px);
    }

    /* --- VIEWPORT CONTAINER --- */
    #viewport-container {
      flex-grow: 1;
      width: 100%;
      position: relative;
      background: #ffffff;
    }

    .browser-frame {
      width: 100%;
      height: 100%;
      border: none;
      display: none;
      background: #ffffff;
    }

    .browser-frame.active-frame {
      display: block;
    }

    /* NEW TAB HOMEPAGE STYLING */
    .new-tab-page {
      width: 100%;
      height: 100%;
      background: var(--bg-darkest);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      color: var(--text-main);
    }

    .speed-dial-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      max-width: 600px;
      width: 90%;
    }

    .speed-card {
      background: var(--bg-header);
      border: 1px solid var(--border);
      padding: 20px;
      border-radius: 12px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
    }

    .speed-card:hover {
      border-color: var(--accent);
      background: var(--bg-hover);
      transform: translateY(-3px);
    }
  </style>
</head>
<body>

  <!-- BROWSER TOP UI CONTAINER -->
  <div id="browser-app-header">
    <div id="tab-strip">
      <div id="tabs-container" style="display:flex; gap:6px;"></div>
      <button id="add-tab-btn" onclick="openNewTab()" title="New Tab">+</button>
    </div>

    <div id="nav-controls-bar">
      <button class="nav-btn" onclick="goBackTab()" title="Back">&#8592;</button>
      <button class="nav-btn" onclick="goForwardTab()" title="Forward">&#8594;</button>
      <button class="nav-btn" onclick="reloadTab()" title="Reload">&#8635;</button>
      
      <form id="omnibox-form" onsubmit="submitSearch(event)">
        <input type="text" id="omnibox-input" placeholder="Search Google or type a web address..." autocomplete="off">
      </form>

      <div id="status-pill">System Ready</div>
    </div>

    <div id="quick-bookmarks">
      <div class="bookmark-btn" onclick="quickLaunch('https://google.com')">🔍 Google</div>
      <div class="bookmark-btn" onclick="quickLaunch('https://youtube.com')">▶️ YouTube</div>
      <div class="bookmark-btn" onclick="quickLaunch('https://discord.com')">💬 Discord</div>
      <div class="bookmark-btn" onclick="quickLaunch('https://reddit.com')">🤖 Reddit</div>
      <div class="bookmark-btn" onclick="quickLaunch('https://wikipedia.org')">📚 Wikipedia</div>
      <div class="bookmark-btn" onclick="quickLaunch('https://github.com')">🐙 GitHub</div>
    </div>
  </div>

  <!-- IFRAME VIEWPORT AREA -->
  <div id="viewport-container"></div>

  <script>
    // ==========================================
    // 1. SMART CROSS-ORIGIN ANTI-NESTING LOCK
    // ==========================================
    try {
      if (window.self !== window.top) {
        // Check if page loaded inside another instance of itself on the same hostname
        if (window.parent.location.hostname === window.location.hostname) {
          document.body.classList.add('is-nested-frame');
        }
      }
    } catch (e) {
      // Cross-origin context (e.g. embedded inside Google Sites). Keep full UI visible!
    }

    // ==========================================
    // 2. HYDRA NETWORK (20 Failover Bare Servers)
    // ==========================================
    const bareFailoverPool = [
      'https://bare-server-y5ch.onrender.com/bare/',
      'https://tomp.app/bare/',
      'https://bare.benrovers.noc.st/bare/',
      'https://b.tomp.app/bare/',
      'https://solar-1.benrovers.noc.st/bare/',
      'https://c.tomp.app/bare/',
      'https://lunar-1.benrovers.noc.st/bare/',
      'https://bare.starlightproxy.com/bare/',
      'https://flowos-bare.onrender.com/bare/',
      'https://bare.mathstudy.app/bare/',
      'https://bare.z1g.top/bare/',
      'https://d.tomp.app/bare/',
      'https://bare.titaniumnetwork.org/bare/',
      'https://e.tomp.app/bare/',
      'https://bare-server.mathstudy.app/bare/'
    ];

    let activeBareIndex = 0;
    let tabsList = [];
    let currentTabId = null;

    const statusPill = document.getElementById('status-pill');
    const omniboxInput = document.getElementById('omnibox-input');
    const tabsContainer = document.getElementById('tabs-container');
    const viewportContainer = document.getElementById('viewport-container');

    // Register UV Service Worker
    async function initServiceWorker() {
      if ('serviceWorker' in navigator) {
        try {
          await navigator.serviceWorker.register(window.__uv$config.sw, { scope: window.__uv$config.prefix });
          await navigator.serviceWorker.ready;
          setStatus("System Ready", "var(--green)");
        } catch (err) {
          setStatus("Service Worker Error", "var(--yellow)");
        }
      }
    }
    initServiceWorker();

    function setStatus(msg, color) {
      statusPill.innerText = msg;
      statusPill.style.color = color;
    }

    // ==========================================
    // 3. MULTI-TAB ARCHITECTURE & MANAGEMENT
    // ==========================================
    function openNewTab(url = '') {
      const id = 'tab-' + Math.random().toString(36).substr(2, 9);

      // Create dedicated iframe for this tab
      const frame = document.createElement('iframe');
      frame.className = 'browser-frame';
      frame.id = 'frame-' + id;
      viewportContainer.appendChild(frame);

      const tabObject = { id: id, title: 'New Tab', url: url, frame: frame };
      tabsList.push(tabObject);

      setActiveTab(id);

      if (url) {
        processNavigation(tabObject, url);
      }
    }

    function setActiveTab(id) {
      currentTabId = id;

      tabsList.forEach(t => {
        const isActive = t.id === id;
        t.frame.classList.toggle('active-frame', isActive);
      });

      renderTabStrip();

      const activeObj = tabsList.find(t => t.id === id);
      omniboxInput.value = activeObj && activeObj.url ? activeObj.url : '';
    }

    function closeTab(id, e) {
      if (e) e.stopPropagation();
      if (tabsList.length === 1) return; // Always keep 1 tab open

      const index = tabsList.findIndex(t => t.id === id);
      const targetTab = tabsList[index];

      targetTab.frame.remove();
      tabsList.splice(index, 1);

      if (currentTabId === id) {
        const fallback = tabsList[Math.max(0, index - 1)];
        setActiveTab(fallback.id);
      } else {
        renderTabStrip();
      }
    }

    function renderTabStrip() {
      tabsContainer.innerHTML = '';
      tabsList.forEach(t => {
        const tabEl = document.createElement('div');
        tabEl.className = `browser-tab ${t.id === currentTabId ? 'active-tab' : ''}`;
        tabEl.onclick = () => setActiveTab(t.id);

        const icon = document.createElement('span');
        icon.className = 'tab-icon';
        icon.innerText = '🌐';

        const title = document.createElement('span');
        title.className = 'tab-title-text';
        title.innerText = t.title || 'New Tab';

        const closeBtn = document.createElement('span');
        closeBtn.className = 'tab-close-btn';
        closeBtn.innerHTML = '&times;';
        closeBtn.onclick = (e) => closeTab(t.id, e);

        tabEl.appendChild(icon);
        tabEl.appendChild(title);
        tabEl.appendChild(closeBtn);
        tabsContainer.appendChild(tabEl);
      });
    }

    // ==========================================
    // 4. URL PARSER & BARE PROXY ROUTING
    // ==========================================
    function submitSearch(e) {
      if (e) e.preventDefault();
      const query = omniboxInput.value.trim();
      if (!query) return;

      let target = query;
      if (!query.startsWith('http://') && !query.startsWith('https://')) {
        if (query.includes('.') && !query.includes(' ')) {
          target = 'https://' + query;
        } else {
          target = 'https://www.google.com/search?q=' + encodeURIComponent(query);
        }
      }

      const activeTab = tabsList.find(t => t.id === currentTabId);
      if (activeTab) {
        processNavigation(activeTab, target);
      }
    }

    function quickLaunch(url) {
      omniboxInput.value = url;
      submitSearch();
    }

    async function processNavigation(tabObj, targetUrl) {
      tabObj.url = targetUrl;
      tabObj.title = targetUrl.replace('https://', '').replace('http://', '').replace('www.', '').split('/')[0];
      renderTabStrip();

      activeBareIndex = 0; // Start with main private Bare server
      connectThroughBarePool(tabObj, targetUrl);
    }

    async function connectThroughBarePool(tabObj, destination) {
      if (activeBareIndex >= bareFailoverPool.length) {
        setStatus("All Nodes Offline", "var(--red)");
        return;
      }

      const currentBare = bareFailoverPool[activeBareIndex];
      window.__uv$config.bare = currentBare;

      if (activeBareIndex === 0) {
        setStatus("Waking Server...", "var(--yellow)");
        try { await fetch(currentBare, { method: 'GET', mode: 'no-cors' }).catch(() => {}); } catch(e) {}
      } else {
        setStatus(`Failover Node ${activeBareIndex + 1}`, "var(--yellow)");
      }

      try {
        const encoded = Ultraviolet.codec.xor.encode(destination);
        tabObj.frame.src = window.__uv$config.prefix + encoded;

        setStatus(activeBareIndex === 0 ? "Protected (Private)" : `Protected (Node ${activeBareIndex + 1})`, "var(--green)");

        tabObj.frame.onerror = () => {
          activeBareIndex++;
          connectThroughBarePool(tabObj, destination);
        };

      } catch (err) {
        activeBareIndex++;
        connectThroughBarePool(tabObj, destination);
      }
    }

    function goBackTab() {
      const cur = tabsList.find(t => t.id === currentTabId);
      if (cur) try { cur.frame.contentWindow.history.back(); } catch(e){}
    }

    function goForwardTab() {
      const cur = tabsList.find(t => t.id === currentTabId);
      if (cur) try { cur.frame.contentWindow.history.forward(); } catch(e){}
    }

    function reloadTab() {
      const cur = tabsList.find(t => t.id === currentTabId);
      if (cur) try { cur.frame.contentWindow.location.reload(); } catch(e){}
    }

    // Launch initial tab
    openNewTab();
  </script>
</body>
</html>
