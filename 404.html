<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browser Hub</title>
  <style>
    :root {
      --bg-dark: #121316;
      --toolbar-bg: #1e1f24;
      --tab-bg: #18191d;
      --tab-active: #2a2b32;
      --text-main: #e1e2e6;
      --text-muted: #8b8e98;
      --accent-color: #3b82f6;
      --border-color: #2e3038;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Window Header & Tabs */
    .chrome-header {
      background-color: var(--tab-bg);
      display: flex;
      flex-direction: column;
      border-bottom: 1px solid var(--border-color);
    }

    .tab-bar {
      display: flex;
      align-items: center;
      padding: 6px 6px 0 6px;
      gap: 4px;
      overflow-x: auto;
    }

    .tab {
      display: flex;
      align-items: center;
      gap: 8px;
      background-color: transparent;
      padding: 8px 14px;
      border-radius: 8px 8px 0 0;
      font-size: 13px;
      color: var(--text-muted);
      cursor: pointer;
      max-width: 200px;
      min-width: 120px;
      user-select: none;
      border: 1px solid transparent;
      border-bottom: none;
    }

    .tab.active {
      background-color: var(--toolbar-bg);
      color: var(--text-main);
      border-color: var(--border-color);
    }

    .tab-title {
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tab-close {
      border: none;
      background: none;
      color: var(--text-muted);
      font-size: 14px;
      cursor: pointer;
      border-radius: 50%;
      width: 18px;
      height: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .tab-close:hover {
      background-color: rgba(255,255,255,0.1);
      color: var(--text-main);
    }

    .new-tab-btn {
      background: none;
      border: none;
      color: var(--text-main);
      font-size: 18px;
      padding: 4px 10px;
      cursor: pointer;
      border-radius: 4px;
    }

    .new-tab-btn:hover { background-color: var(--toolbar-bg); }

    /* Navigation Toolbar */
    .toolbar {
      background-color: var(--toolbar-bg);
      display: flex;
      align-items: center;
      padding: 8px 12px;
      gap: 10px;
    }

    .nav-btn {
      background: none;
      border: none;
      color: var(--text-main);
      font-size: 16px;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 4px;
    }

    .nav-btn:hover { background-color: rgba(255,255,255,0.08); }

    .address-bar {
      flex: 1;
      display: flex;
      align-items: center;
      background-color: var(--bg-dark);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 4px 12px;
    }

    .address-bar input {
      width: 100%;
      background: none;
      border: none;
      outline: none;
      color: var(--text-main);
      font-size: 13px;
    }

    .status-badge {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 12px;
      background-color: rgba(16, 185, 129, 0.15);
      color: #10b981;
      border: 1px solid rgba(16, 185, 129, 0.3);
      white-space: nowrap;
    }

    /* Bookmarks Bar */
    .bookmarks-bar {
      background-color: var(--toolbar-bg);
      display: flex;
      gap: 12px;
      padding: 4px 16px 8px 16px;
      border-bottom: 1px solid var(--border-color);
    }

    .bookmark-item {
      font-size: 12px;
      color: var(--text-muted);
      cursor: pointer;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .bookmark-item:hover { color: var(--text-main); }

    /* Content Area */
    .viewport-container {
      flex: 1;
      position: relative;
      background-color: var(--bg-dark);
    }

    .tab-viewport {
      width: 100%;
      height: 100%;
      border: none;
      display: none;
    }

    .tab-viewport.active { display: block; }

    /* Home Screen overlay for new tab */
    .home-screen {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: var(--bg-dark);
      z-index: 10;
    }

    .home-screen h1 { font-size: 32px; margin-bottom: 12px; color: #60a5fa; }
    .home-screen p { color: var(--text-muted); font-size: 14px; }
  </style>
</head>
<body>

  <div class="chrome-header">
    <div class="tab-bar" id="tabBar">
      <button class="new-tab-btn" onclick="createNewTab()">+</button>
    </div>
    <div class="toolbar">
      <button class="nav-btn" onclick="getActiveTab()?.goBack()">&#129144;</button>
      <button class="nav-btn" onclick="getActiveTab()?.goForward()">&#129146;</button>
      <button class="nav-btn" onclick="getActiveTab()?.reload()">&#8635;</button>
      <div class="address-bar">
        <input type="text" id="urlInput" placeholder="Search Google or type a URL..." onkeydown="handleUrlSubmit(event)">
      </div>
      <div class="status-badge" id="proxyStatus">Proxy Active</div>
    </div>
    <div class="bookmarks-bar">
      <span class="bookmark-item" onclick="navigateActiveTab('https://google.com')">🔍 Google</span>
      <span class="bookmark-item" onclick="navigateActiveTab('https://youtube.com')">▶️ YouTube</span>
      <span class="bookmark-item" onclick="navigateActiveTab('https://discord.com')">💬 Discord</span>
      <span class="bookmark-item" onclick="navigateActiveTab('https://reddit.com')">🤖 Reddit</span>
      <span class="bookmark-item" onclick="navigateActiveTab('https://wikipedia.org')">🌐 Wikipedia</span>
    </div>
  </div>

  <div class="viewport-container" id="viewportContainer">
    <div class="home-screen" id="homeScreen">
      <h1>Browser Hub</h1>
      <p>Type a URL or search query above to begin browsing.</p>
    </div>
  </div>

  <script>
    // Configuration: Point to your deployed proxy endpoint / ServiceWorker route
    const PROXY_PREFIX = "/service/"; 
    let tabs = [];
    let activeTabId = null;

    class Tab {
      constructor(id, title = "New Tab", url = "") {
        this.id = id;
        this.title = title;
        this.url = url;
        
        // Element creation
        this.tabEl = document.createElement("div");
        this.tabEl.className = "tab";
        this.tabEl.onclick = () => switchTab(this.id);
        this.tabEl.innerHTML = `
          <span class="tab-title">${title}</span>
          <button class="tab-close" onclick="closeTab('${this.id}', event)">&times;</button>
        `;

        this.iframeEl = document.createElement("iframe");
        this.iframeEl.className = "tab-viewport";
        
        if (url) {
          this.loadUrl(url);
        }
      }

      loadUrl(rawInput) {
        let finalUrl = rawInput.trim();
        if (!finalUrl) return;

        // Auto-format domain vs search query
        if (!/^https?:\/\//i.test(finalUrl)) {
          if (finalUrl.includes(".") && !finalUrl.includes(" ")) {
            finalUrl = "https://" + finalUrl;
          } else {
            finalUrl = `https://www.google.com/search?q=${encodeURIComponent(finalUrl)}`;
          }
        }

        this.url = finalUrl;
        this.title = new URL(finalUrl).hostname.replace("www.", "");
        this.tabEl.querySelector(".tab-title").innerText = this.title;

        // Route URL through the service worker proxy path
        this.iframeEl.src = PROXY_PREFIX + encodeURIComponent(finalUrl);
      }

      reload() { if (this.iframeEl.src) this.iframeEl.src = this.iframeEl.src; }
      goBack() { try { this.iframeEl.contentWindow.history.back(); } catch(e){} }
      goForward() { try { this.iframeEl.contentWindow.history.forward(); } catch(e){} }
    }

    function createNewTab(url = "") {
      const id = "tab-" + Date.now();
      const tab = new Tab(id, url ? "Loading..." : "New Tab", url);
      
      tabs.push(tab);
      
      const newBtn = document.querySelector(".new-tab-btn");
      document.getElementById("tabBar").insertBefore(tab.tabEl, newBtn);
      document.getElementById("viewportContainer").appendChild(tab.iframeEl);

      switchTab(id);
    }

    function switchTab(id) {
      activeTabId = id;
      const homeScreen = document.getElementById("homeScreen");
      const urlInput = document.getElementById("urlInput");

      tabs.forEach(t => {
        if (t.id === id) {
          t.tabEl.classList.add("active");
          t.iframeEl.classList.add("active");
          urlInput.value = t.url;
          homeScreen.style.display = t.url ? "none" : "flex";
        } else {
          t.tabEl.classList.remove("active");
          t.iframeEl.classList.remove("active");
        }
      });
    }

    function closeTab(id, event) {
      event.stopPropagation();
      const index = tabs.findIndex(t => t.id === id);
      if (index === -1) return;

      const tabToRemove = tabs[index];
      tabToRemove.tabEl.remove();
      tabToRemove.iframeEl.remove(); // Unmounts frame to free browser memory
      tabs.splice(index, 1);

      if (activeTabId === id) {
        if (tabs.length > 0) {
          const nextTab = tabs[Math.max(0, index - 1)];
          switchTab(nextTab.id);
        } else {
          activeTabId = null;
          document.getElementById("urlInput").value = "";
          document.getElementById("homeScreen").style.display = "flex";
        }
      }
    }

    function getActiveTab() {
      return tabs.find(t => t.id === activeTabId);
    }

    function handleUrlSubmit(e) {
      if (e.key === "Enter") {
        const val = e.target.value;
        let active = getActiveTab();
        if (!active) {
          createNewTab(val);
        } else {
          active.loadUrl(val);
          document.getElementById("homeScreen").style.display = "none";
        }
      }
    }

    function navigateActiveTab(url) {
      document.getElementById("urlInput").value = url;
      let active = getActiveTab();
      if (!active) {
        createNewTab(url);
      } else {
        active.loadUrl(url);
        document.getElementById("homeScreen").style.display = "none";
      }
    }

    // Register Service Worker on Startup
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js', { scope: '/' })
        .then(() => {
          document.getElementById('proxyStatus').innerText = "Proxy Connected";
        })
        .catch((err) => {
          console.error("SW Registration failed:", err);
          document.getElementById('proxyStatus').innerText = "Service Worker Error";
          document.getElementById('proxyStatus').style.color = "#ef4444";
        });
    }

    // Initialize with one default tab
    createNewTab();
  </script>
</body>
</html>
