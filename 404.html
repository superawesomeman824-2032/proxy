<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browser Hub - S++++ Tier Edition</title>
  
  <!-- Ultraviolet Core Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/@titaniumnetwork-dev/ultraviolet@3.2.7/dist/uv.bundle.js"></script>
  
  <script>
    // GitHub Pages Base Path Resolution
    const pathSegments = window.location.pathname.split('/').filter(Boolean);
    const repoSubpath = (window.location.hostname.includes('github.io') && pathSegments.length > 0) 
      ? '/' + pathSegments[0] + '/' 
      : '/';

    window.__uv$config = {
      prefix: repoSubpath + 'uv/service/',
      bare: 'https://bare-server-y5ch.onrender.com/bare/',
      encodeUrl: Ultraviolet.codec.xor.encode,
      decodeUrl: Ultraviolet.codec.xor.decode,
      handler: 'https://cdn.jsdelivr.net/npm/@titaniumnetwork-dev/ultraviolet@3.2.7/dist/uv.handler.js',
      client: 'https://cdn.jsdelivr.net/npm/@titaniumnetwork-dev/ultraviolet@3.2.7/dist/uv.client.js',
      bundle: 'https://cdn.jsdelivr.net/npm/@titaniumnetwork-dev/ultraviolet@3.2.7/dist/uv.bundle.js',
      config: repoSubpath + 'uv.config.js',
      sw: repoSubpath + 'sw.js',
    };
  </script>

  <style>
    :root {
      --bg-dark: #090d16;
      --bg-header: #121824;
      --bg-input: #000000;
      --accent: #3b82f6;
      --accent-hover: #60a5fa;
      --border: #1e293b;
      --text: #f8fafc;
      --text-muted: #64748b;
      --status-green: #10b981;
      --status-yellow: #f59e0b;
      --status-red: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      background: var(--bg-dark);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--text);
      overflow: hidden;
    }

    body { display: flex; flex-direction: column; }

    /* ANTI-NESTING RULE: Prevents stacking duplicate browser bars */
    .is-nested #app-header { display: none !important; }
    .is-nested #subtab-bar { display: none !important; }
    .is-nested #workspace { height: 100vh !important; }

    /* --- TOP HEADER & TABS --- */
    #app-header {
      background: var(--bg-header);
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      user-select: none;
    }

    #main-tab-bar {
      display: flex;
      align-items: center;
      background: #070a10;
      padding: 6px 8px 0 8px;
      gap: 4px;
      overflow-x: auto;
    }

    .tab {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #182232;
      border: 1px solid var(--border);
      border-bottom: none;
      padding: 6px 12px;
      border-radius: 8px 8px 0 0;
      font-size: 12px;
      color: var(--text-muted);
      cursor: pointer;
      max-width: 180px;
      min-width: 110px;
      transition: all 0.15s ease;
    }

    .tab.active {
      background: var(--bg-header);
      color: var(--text);
      border-top: 2px solid var(--accent);
      font-weight: 600;
    }

    .tab-title {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex-grow: 1;
    }

    .tab-close {
      border-radius: 50%;
      width: 16px;
      height: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
    }

    .tab-close:hover { background: rgba(239, 68, 68, 0.3); color: var(--status-red); }

    .add-tab-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 16px;
      padding: 4px 10px;
      cursor: pointer;
      border-radius: 4px;
    }

    .add-tab-btn:hover { background: #1e293b; color: var(--text); }

    /* --- OMNIBOX NAVBAR --- */
    #nav-bar {
      padding: 8px 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .nav-btn {
      background: #182232;
      border: 1px solid var(--border);
      color: var(--text);
      width: 32px;
      height: 32px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }

    .nav-btn:hover { background: var(--accent); border-color: var(--accent-hover); }

    #omnibox-form { flex-grow: 1; display: flex; }

    #omnibox {
      width: 100%;
      height: 32px;
      padding: 0 12px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--bg-input);
      color: var(--text);
      outline: none;
      font-size: 13px;
    }

    #omnibox:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2); }

    #status-badge {
      font-size: 11px;
      font-weight: 600;
      padding: 4px 8px;
      border-radius: 12px;
      background: #000;
      border: 1px solid var(--border);
      white-space: nowrap;
    }

    /* --- TABS INSIDE TABS (SUB-TAB BAR) --- */
    #subtab-bar {
      background: #0d131f;
      padding: 4px 12px;
      display: flex;
      align-items: center;
      gap: 6px;
      border-bottom: 1px solid var(--border);
    }

    .subtab-label {
      font-size: 11px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: bold;
      margin-right: 6px;
    }

    .subtab {
      background: #182232;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 2px 10px;
      border-radius: 12px;
      font-size: 11px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .subtab.active { background: var(--accent); color: #fff; border-color: var(--accent-hover); }

    /* --- WORKSPACE & FRAMES --- */
    #workspace {
      flex-grow: 1;
      width: 100%;
      position: relative;
      background: #ffffff;
    }

    .browser-frame {
      width: 100%;
      height: 100%;
      border: none;
      display: none;
      background: #ffffff;
    }

    .browser-frame.active { display: block; }

    /* --- SPEED DIAL / NEW TAB PAGE --- */
    .speed-dial-page {
      width: 100%;
      height: 100%;
      background: var(--bg-dark);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      color: var(--text);
    }

    .speed-dial-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
      max-width: 600px;
    }

    .speed-card {
      background: #121824;
      border: 1px solid var(--border);
      padding: 15px;
      border-radius: 8px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
    }

    .speed-card:hover { border-color: var(--accent); transform: translateY(-2px); }
  </style>
</head>
<body>

  <div id="app-header">
    <div id="main-tab-bar">
      <div id="tabs-container" style="display:flex; gap:4px;"></div>
      <button class="add-tab-btn" onclick="createNewMainTab()" title="New Main Tab">+</button>
    </div>

    <div id="nav-bar">
      <button class="nav-btn" onclick="activeGoBack()" title="Back">&#8592;</button>
      <button class="nav-btn" onclick="activeGoForward()" title="Forward">&#8594;</button>
      <button class="nav-btn" onclick="activeReload()" title="Reload">&#8635;</button>
      
      <form id="omnibox-form" onsubmit="handleNavigation(event)">
        <input type="text" id="omnibox" placeholder="Search Google or type a web address..." autocomplete="off">
      </form>

      <div id="status-badge">System Initializing</div>
    </div>

    <div id="subtab-bar">
      <span class="subtab-label">Nested Sub-Tabs:</span>
      <div id="subtabs-container" style="display:flex; gap:4px;"></div>
      <button class="add-tab-btn" onclick="createNewSubTab()" title="New Sub-Tab Inside Current Tab" style="font-size:12px;">+ Add Sub-Tab</button>
    </div>
  </div>

  <div id="workspace"></div>

  <script>
    // ==========================================
    // 1. SMART CROSS-ORIGIN ANTI-NESTING GUARD
    // ==========================================
    try {
      if (window.self !== window.top) {
        if (window.parent.location.hostname === window.location.hostname) {
          document.documentElement.classList.add('is-nested');
        }
      }
    } catch (e) {
      // Safely embedded inside Google Sites or external iframe
    }

    // ==========================================
    // 2. HYDRA NETWORK BARE ENDPOINTS (20 Node Pool)
    // ==========================================
    const bareNodes = [
      'https://bare-server-y5ch.onrender.com/bare/',
      'https://tomp.app/bare/',
      'https://bare.benrovers.noc.st/bare/',
      'https://b.tomp.app/bare/',
      'https://solar-1.benrovers.noc.st/bare/',
      'https://c.tomp.app/bare/',
      'https://lunar-1.benrovers.noc.st/bare/',
      'https://bare.starlightproxy.com/bare/',
      'https://flowos-bare.onrender.com/bare/',
      'https://bare.mathstudy.app/bare/',
      'https://bare.z1g.top/bare/',
      'https://d.tomp.app/bare/',
      'https://bare.titaniumnetwork.org/bare/'
    ];

    let activeBareIndex = 0;
    let mainTabs = [];
    let activeMainTabId = null;

    const statusBadge = document.getElementById('status-badge');
    const omnibox = document.getElementById('omnibox');
    const tabsContainer = document.getElementById('tabs-container');
    const subtabsContainer = document.getElementById('subtabs-container');
    const workspace = document.getElementById('workspace');

    // Register Service Worker
    async function initWorker() {
      if ('serviceWorker' in navigator) {
        try {
          await navigator.serviceWorker.register(window.__uv$config.sw, { scope: window.__uv$config.prefix });
          await navigator.serviceWorker.ready;
          setStatus("System Ready", "var(--status-green)");
        } catch (e) {
          setStatus("SW Pending", "var(--status-yellow)");
        }
      }
    }
    initWorker();

    function setStatus(msg, color) {
      statusBadge.innerText = msg;
      statusBadge.style.color = color;
    }

    // ==========================================
    // 3. TABS INSIDE TABS MANAGER
    // ==========================================
    function createNewMainTab() {
      const mainId = 'main-' + Math.random().toString(36).substr(2, 9);
      const newMainTab = { id: mainId, title: 'New Tab', subTabs: [], activeSubId: null };
      
      mainTabs.push(newMainTab);
      switchMainTab(mainId);
      createNewSubTab(); // Auto-create first sub-tab
    }

    function createNewSubTab(url = '') {
      const currentMain = mainTabs.find(m => m.id === activeMainTabId);
      if (!currentMain) return;

      const subId = 'sub-' + Math.random().toString(36).substr(2, 9);
      const frame = document.createElement('iframe');
      frame.className = 'browser-frame';
      frame.id = 'frame-' + subId;
      workspace.appendChild(frame);

      const subTabData = { id: subId, title: 'Blank', url: url, frame: frame };
      currentMain.subTabs.push(subTabData);

      switchSubTab(subId);

      if (url) {
        navigate(subTabData, url);
      }
    }

    function switchMainTab(mainId) {
      activeMainTabId = mainId;
      renderTabs();
      
      const currentMain = mainTabs.find(m => m.id === mainId);
      if (currentMain && currentMain.activeSubId) {
        switchSubTab(currentMain.activeSubId);
      }
    }

    function switchSubTab(subId) {
      const currentMain = mainTabs.find(m => m.id === activeMainTabId);
      if (!currentMain) return;

      currentMain.activeSubId = subId;

      // Update Frame visibility
      document.querySelectorAll('.browser-frame').forEach(f => f.classList.remove('active'));
      const activeSub = currentMain.subTabs.find(s => s.id === subId);
      if (activeSub) {
        activeSub.frame.classList.add('active');
        omnibox.value = activeSub.url || '';
      }

      renderTabs();
    }

    function renderTabs() {
      // Render Main Tabs
      tabsContainer.innerHTML = '';
      mainTabs.forEach(m => {
        const tabEl = document.createElement('div');
        tabEl.className = `tab ${m.id === activeMainTabId ? 'active' : ''}`;
        tabEl.onclick = () => switchMainTab(m.id);

        const title = document.createElement('span');
        title.className = 'tab-title';
        title.innerText = m.title;

        const close = document.createElement('span');
        close.className = 'tab-close';
        close.innerHTML = '&times;';
        close.onclick = (e) => closeMainTab(m.id, e);

        tabEl.appendChild(title);
        tabEl.appendChild(close);
        tabsContainer.appendChild(tabEl);
      });

      // Render Sub-Tabs for active Main Tab
      subtabsContainer.innerHTML = '';
      const currentMain = mainTabs.find(m => m.id === activeMainTabId);
      if (currentMain) {
        currentMain.subTabs.forEach(s => {
          const subEl = document.createElement('div');
          subEl.className = `subtab ${s.id === currentMain.activeSubId ? 'active' : ''}`;
          subEl.innerText = s.title;
          subEl.onclick = () => switchSubTab(s.id);

          subtabsContainer.appendChild(subEl);
        });
      }
    }

    function closeMainTab(mainId, e) {
      if (e) e.stopPropagation();
      if (mainTabs.length === 1) return;

      const idx = mainTabs.findIndex(m => m.id === mainId);
      const target = mainTabs[idx];

      target.subTabs.forEach(s => s.frame.remove());
      mainTabs.splice(idx, 1);

      const nextMain = mainTabs[Math.max(0, idx - 1)];
      switchMainTab(nextMain.id);
    }

    // ==========================================
    // 4. PROXY ROUTING ENGINE
    // ==========================================
    function handleNavigation(e) {
      if (e) e.preventDefault();
      const val = omnibox.value.trim();
      if (!val) return;

      let targetUrl = val;
      if (!val.startsWith('http://') && !val.startsWith('https://')) {
        targetUrl = val.includes('.') && !val.includes(' ') 
          ? 'https://' + val 
          : 'https://www.google.com/search?q=' + encodeURIComponent(val);
      }

      const currentMain = mainTabs.find(m => m.id === activeMainTabId);
      if (currentMain) {
        const currentSub = currentMain.subTabs.find(s => s.id === currentMain.activeSubId);
        if (currentSub) navigate(currentSub, targetUrl);
      }
    }

    async function navigate(subTab, url) {
      subTab.url = url;
      subTab.title = url.replace('https://', '').replace('www.', '').split('/')[0];
      
      const currentMain = mainTabs.find(m => m.id === activeMainTabId);
      if (currentMain) currentMain.title = subTab.title;
      
      renderTabs();

      activeBareIndex = 0;
      executeBareRoute(subTab, url);
    }

    async function executeBareRoute(subTab, targetUrl) {
      if (activeBareIndex >= bareNodes.length) {
        setStatus("All Nodes Failed", "var(--status-red)");
        return;
      }

      const endpoint = bareNodes[activeBareIndex];
      window.__uv$config.bare = endpoint;

      if (activeBareIndex === 0) {
        setStatus("Connecting...", "var(--status-yellow)");
        try { await fetch(endpoint, { method: 'GET', mode: 'no-cors' }).catch(() => {}); } catch(e){}
      } else {
        setStatus(`Node ${activeBareIndex + 1}/${bareNodes.length}`, "var(--status-yellow)");
      }

      try {
        const encoded = Ultraviolet.codec.xor.encode(targetUrl);
        subTab.frame.src = window.__uv$config.prefix + encoded;
        setStatus(activeBareIndex === 0 ? "Secured (Private)" : `Connected (Node ${activeBareIndex + 1})`, "var(--status-green)");
      } catch (err) {
        activeBareIndex++;
        executeBareRoute(subTab, targetUrl);
      }
    }

    function activeGoBack() {
      const currentMain = mainTabs.find(m => m.id === activeMainTabId);
      if (currentMain) {
        const currentSub = currentMain.subTabs.find(s => s.id === currentMain.activeSubId);
        if (currentSub) try { currentSub.frame.contentWindow.history.back(); } catch(e){}
      }
    }

    function activeGoForward() {
      const currentMain = mainTabs.find(m => m.id === activeMainTabId);
      if (currentMain) {
        const currentSub = currentMain.subTabs.find(s => s.id === currentMain.activeSubId);
        if (currentSub) try { currentSub.frame.contentWindow.history.forward(); } catch(e){}
      }
    }

    function activeReload() {
      const currentMain = mainTabs.find(m => m.id === activeMainTabId);
      if (currentMain) {
        const currentSub = currentMain.subTabs.find(s => s.id === currentMain.activeSubId);
        if (currentSub) try { currentSub.frame.contentWindow.location.reload(); } catch(e){}
      }
    }

    // Boot up first main tab
    createNewMainTab();
  </script>
</body>
</html>
