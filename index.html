<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browser Hub</title>
  <script src="https://cdn.jsdelivr.net/npm/@titaniumnetwork-dev/ultraviolet@3.2.7/dist/uv.bundle.js"></script>
  <script>
    const pathSegments = window.location.pathname.split('/').filter(Boolean);
    const repoSubpath = (window.location.hostname.includes('github.io') && pathSegments.length > 0) 
      ? '/' + pathSegments[0] + '/' 
      : '/';

    window.__uv$config = {
      prefix: repoSubpath + 'uv/service/',
      bare: 'https://bare-server-y5ch.onrender.com/bare/',
      encodeUrl: Ultraviolet.codec.xor.encode,
      decodeUrl: Ultraviolet.codec.xor.decode,
      handler: 'https://cdn.jsdelivr.net/npm/@titaniumnetwork-dev/ultraviolet@3.2.7/dist/uv.handler.js',
      client: 'https://cdn.jsdelivr.net/npm/@titaniumnetwork-dev/ultraviolet@3.2.7/dist/uv.client.js',
      bundle: 'https://cdn.jsdelivr.net/npm/@titaniumnetwork-dev/ultraviolet@3.2.7/dist/uv.bundle.js',
      config: repoSubpath + 'uv.config.js',
      sw: repoSubpath + 'sw.js',
    };
  </script>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background: #0f1117; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      color: #f0f6fc; overflow: hidden;
    }
    body { display: flex; flex-direction: column; }
    #browser-bar {
      background: #161b22; padding: 10px 15px; display: flex; align-items: center; gap: 10px;
      border-bottom: 1px solid #30363d; flex-shrink: 0; height: 50px; width: 100%;
    }
    .browser-btn {
      background: #21262d; border: 1px solid #30363d; color: #f0f6fc;
      padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 14px;
    }
    .browser-btn:hover { background: #30363d; }
    #search-form { flex-grow: 1; display: flex; }
    input {
      width: 100%; padding: 8px 14px; border-radius: 6px; border: 1px solid #30363d;
      background: #0d1117; color: #f0f6fc; outline: none; font-size: 14px;
    }
    input:focus { border-color: #58a6ff; }
    #status { font-size: 11px; color: #8b949e; white-space: nowrap; min-width: 140px; text-align: right; }
    #proxy-frame {
      flex-grow: 1; border: none; width: 100%; height: calc(100vh - 50px); background: #ffffff;
    }
  </style>
</head>
<body>

  <div id="browser-bar">
    <button class="browser-btn" onclick="goBack()" title="Back">&#8592;</button>
    <button class="browser-btn" onclick="goForward()" title="Forward">&#8594;</button>
    <button class="browser-btn" onclick="reloadFrame()" title="Reload">&#8635;</button>
    <form id="search-form" onsubmit="loadURL(event)">
      <input type="text" id="url-input" placeholder="Search or enter website URL..." autocomplete="off" autofocus>
    </form>
    <div id="status">System Ready</div>
  </div>

  <iframe id="proxy-frame"></iframe>

  <script>
    // IFRAME GUARD: Instantly hides the browser bar if it ever tries to nest inside itself
    if (window.self !== window.top) {
      const bar = document.getElementById('browser-bar');
      if (bar) bar.style.display = 'none';
      const f = document.getElementById('proxy-frame');
      if (f) f.style.height = '100vh';
    }

    const bareServers = [
      'https://bare-server-y5ch.onrender.com/bare/',
      'https://tomp.app/bare/',
      'https://bare.benrovers.noc.st/bare/'
    ];

    let activeBareIndex = 0;
    let pendingUrl = '';
    const frame = document.getElementById('proxy-frame');
    const input = document.getElementById('url-input');
    const statusEl = document.getElementById('status');

    async function initServiceWorker() {
      if (!('serviceWorker' in navigator)) return;
      try {
        await navigator.serviceWorker.register(window.__uv$config.sw, { scope: window.__uv$config.prefix });
        await navigator.serviceWorker.ready;
        if (window.self === window.top) {
          statusEl.innerText = "System Ready";
          statusEl.style.color = "#3fb950";
        }
      } catch (err) {
        if (window.self === window.top) {
          statusEl.innerText = "System Ready";
          statusEl.style.color = "#3fb950";
        }
      }
    }
    initServiceWorker();

    function goBack() { try { frame.contentWindow.history.back(); } catch(e){} }
    function goForward() { try { frame.contentWindow.history.forward(); } catch(e){} }
    function reloadFrame() { frame.contentWindow.location.reload(); }

    async function loadURL(e) {
      if (e) e.preventDefault();
      let val = input.value.trim();
      if (!val) return;

      pendingUrl = val.startsWith('http://') || val.startsWith('https://') 
        ? val 
        : (val.includes('.') && !val.includes(' ') ? 'https://' + val : 'https://www.google.com/search?q=' + encodeURIComponent(val));

      activeBareIndex = 0;
      attemptConnection();
    }

    async function attemptConnection() {
      if (activeBareIndex >= bareServers.length) {
        statusEl.innerText = "All Servers Failed";
        statusEl.style.color = "#ff7b72";
        return;
      }

      const currentBare = bareServers[activeBareIndex];
      window.__uv$config.bare = currentBare;

      statusEl.innerText = activeBareIndex === 0 ? "Waking Render (30s)..." : `Fallback #${activeBareIndex}`;
      statusEl.style.color = "#58a6ff";

      if (activeBareIndex === 0) {
        try {
          await fetch(currentBare, { method: 'GET', mode: 'no-cors' }).catch(() => {});
        } catch(e) {}
      }

      try {
        const encoded = Ultraviolet.codec.xor.encode(pendingUrl);
        frame.src = window.__uv$config.prefix + encoded;
        statusEl.innerText = activeBareIndex === 0 ? "Connected (Private)" : `Connected (Fallback)`;
        statusEl.style.color = "#3fb950";
      } catch (err) {
        activeBareIndex++;
        attemptConnection();
      }
    }
  </script>
</body>
</html>
