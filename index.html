<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browser Hub</title>
  <script src="https://cdn.jsdelivr.net/npm/@titaniumnetwork-dev/ultraviolet@3.2.7/dist/uv.bundle.js"></script>
  <script>
    // Auto-detect GitHub Pages repository subpath routing
    const pathSegments = window.location.pathname.split('/').filter(Boolean);
    const repoSubpath = (window.location.hostname.includes('github.io') && pathSegments.length > 0) 
      ? '/' + pathSegments[0] + '/' 
      : '/';

    window.__uv$config = {
      prefix: repoSubpath + 'uv/service/',
      bare: 'https://bare-server-y5ch.onrender.com/bare/', // Primary Private Render Server[cite: 2]
      encodeUrl: Ultraviolet.codec.xor.encode,
      decodeUrl: Ultraviolet.codec.xor.decode,
      handler: 'https://cdn.jsdelivr.net/npm/@titaniumnetwork-dev/ultraviolet@3.2.7/dist/uv.handler.js',
      client: 'https://cdn.jsdelivr.net/npm/@titaniumnetwork-dev/ultraviolet@3.2.7/dist/uv.client.js',
      bundle: 'https://cdn.jsdelivr.net/npm/@titaniumnetwork-dev/ultraviolet@3.2.7/dist/uv.bundle.js',
      config: repoSubpath + 'uv.config.js',
      sw: repoSubpath + 'sw.js',
    };
  </script>
  <style>
    :root {
      --bg-main: #0f1117;
      --bg-bar: #161b22;
      --border: #30363d;
      --text: #f0f6fc;
      --accent: #58a6ff;
      --success: #3fb950;
      --error: #ff7b72;
    }
    body {
      margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh;
      background: var(--bg-main); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      color: var(--text); overflow: hidden;
    }
    #browser-bar {
      background: var(--bg-bar); padding: 10px 15px; display: flex; align-items: center; gap: 10px;
      border-bottom: 1px solid var(--border); flex-shrink: 0; box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }
    .browser-btn {
      background: #21262d; border: 1px solid var(--border); color: var(--text);
      padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 14px; transition: background 0.2s;
    }
    .browser-btn:hover { background: #30363d; }
    #search-form { flex-grow: 1; display: flex; }
    input {
      width: 100%; padding: 8px 14px; border-radius: 6px; border: 1px solid var(--border);
      background: #0d1117; color: var(--text); outline: none; font-size: 14px; transition: border-color 0.2s;
    }
    input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.15); }
    #status { font-size: 11px; color: #8b949e; white-space: nowrap; font-weight: 500; min-width: 90px; text-align: right; }
    iframe { flex-grow: 1; border: none; width: 100%; height: 100%; background: #ffffff; }
  </style>
</head>
<body>

  <div id="browser-bar">
    <button class="browser-btn" onclick="goBack()" title="Back">&#8592;</button>
    <button class="browser-btn" onclick="goForward()" title="Forward">&#8594;</button>
    <button class="browser-btn" onclick="reloadFrame()" title="Reload">&#8635;</button>
    <form id="search-form" onsubmit="loadURL(event)">
      <input type="text" id="url-input" placeholder="Search or enter website URL..." autocomplete="off" autofocus>
    </form>
    <div id="status">Ready</div>
  </div>

  <iframe id="proxy-frame"></iframe>

  <script>
    // MULTIPLE BARE SERVER BACKUP LIST
    const bareServers = [
      'https://bare-server-y5ch.onrender.com/bare/', // Primary Private Render Server[cite: 2]
      'https://tomp.app/',                          // Backup 1
      'https://bare.benrovers.noc.st/'             // Backup 2
    ];

    let activeBareIndex = 0;
    let pendingUrl = '';
    const frame = document.getElementById('proxy-frame');
    const input = document.getElementById('url-input');
    const statusEl = document.getElementById('status');

    // Initialize Service Worker instantly
    async function initServiceWorker() {
      if (!('serviceWorker' in navigator)) return;
      try {
        await navigator.serviceWorker.register('./sw.js', { scope: window.__uv$config.prefix });
        await navigator.serviceWorker.ready;
        statusEl.innerText = "Connected";
        statusEl.style.color = "var(--success)";
      } catch (err) {
        statusEl.innerText = "SW Error";
        statusEl.style.color = "var(--error)";
      }
    }
    initServiceWorker();

    function goBack() { try { frame.contentWindow.history.back(); } catch(e){} }
    function goForward() { try { frame.contentWindow.history.forward(); } catch(e){} }
    function reloadFrame() { frame.contentWindow.location.reload(); }

    async function loadURL(e) {
      if (e) e.preventDefault();
      let val = input.value.trim();
      if (!val) return;

      pendingUrl = val.startsWith('http://') || val.startsWith('https://') 
        ? val 
        : (val.includes('.') && !val.includes(' ') ? 'https://' + val : 'https://www.google.com/search?q=' + encodeURIComponent(val));

      activeBareIndex = 0;
      attemptConnection();
    }

    async function attemptConnection() {
      if (activeBareIndex >= bareServers.length) {
        statusEl.innerText = "All servers failed";
        statusEl.style.color = "var(--error)";
        return;
      }

      const currentBare = bareServers[activeBareIndex];
      window.__uv$config.bare = currentBare;

      statusEl.innerText = activeBareIndex === 0 ? "Loading..." : `Fallback #${activeBareIndex}...`;
      statusEl.style.color = "var(--accent)";

      if ('serviceWorker' in navigator) {
        try {
          await navigator.serviceWorker.register('./sw.js', { scope: window.__uv$config.prefix });
          await navigator.serviceWorker.ready;
        } catch (err) {}
      }

      try {
        const encoded = Ultraviolet.codec.xor.encode(pendingUrl);
        frame.src = window.__uv$config.prefix + encoded;

        // Instant safe status update so it never hangs on "Loading..."
        setTimeout(() => {
          statusEl.innerText = activeBareIndex === 0 ? "Active (Private)" : `Active (Fallback #${activeBareIndex})`;
          statusEl.style.color = "var(--success)";
        }, 1200);

      } catch (err) {
        activeBareIndex++;
        attemptConnection();
      }
    }
  </script>
</body>
</html>
