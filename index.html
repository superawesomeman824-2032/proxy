<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proxy Hub</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      background: #0f1117;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #f0f6fc;
      overflow: hidden;
    }
    #top-bar {
      background: #161b22;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 15px;
      border-bottom: 1px solid #30363d;
      flex-shrink: 0;
    }
    h1 {
      margin: 0;
      font-size: 18px;
      color: #58a6ff;
      font-weight: 600;
    }
    #search-form {
      flex-grow: 1;
      max-width: 600px;
    }
    input {
      width: 100%;
      padding: 8px 14px;
      border-radius: 6px;
      border: 1px solid #30363d;
      background: #0d1117;
      color: #f0f6fc;
      font-size: 14px;
      outline: none;
    }
    input:focus {
      border-color: #58a6ff;
    }
    #status {
      font-size: 12px;
      color: #8b949e;
      margin-left: auto;
    }
    iframe {
      flex-grow: 1;
      border: none;
      width: 100%;
      height: 100%;
      background: #ffffff;
    }
  </style>
</head>
<body>

  <div id="top-bar">
    <h1>Proxy</h1>
    <form id="search-form" onsubmit="loadURL(event)">
      <input type="text" id="url-input" placeholder="Type a website URL or search query..." autocomplete="off" autofocus>
    </form>
    <div id="status">Ready (25 Backups Loaded)</div>
  </div>

  <iframe id="proxy-frame"></iframe>

  <script>
    const input = document.getElementById('url-input');
    const frame = document.getElementById('proxy-frame');
    const status = document.getElementById('status');

    // 25 Public Gateway / Bare Endpoints Rotation Array
    const gateways = [
      'https://uv.student-projects.workers.dev/service/',
      'https://proxy.student-projects.workers.dev/service/',
      'https://uv.to-be-continued.workers.dev/service/',
      'https://uv.holyunblocker.workers.dev/service/',
      'https://incognito.pro/service/',
      'https://zengarden.org/service/',
      'https://mathclass.site/service/',
      'https://sciencehomework.net/service/',
      'https://englishclass.me/service/',
      'https://historyproject.site/service/',
      'https://physicslab.app/service/',
      'https://chemistryportal.org/service/',
      'https://algebra.duckdns.org/service/',
      'https://geometry.duckdns.org/service/',
      'https://canvas-login.org/service/',
      'https://classroom-edu.net/service/',
      'https://edpuzzle-bypass.org/service/',
      'https://kahoot-cheat.net/service/',
      'https://quizlet-bypass.org/service/',
      'https://blooket-hack.net/service/',
      'https://geography-map.org/service/',
      'https://literature-hub.net/service/',
      'https://study-hall.org/service/',
      'https://homework-helper.net/service/',
      'https://test-prep.site/service/'
    ];

    let currentGatewayIndex = 0;

    function loadURL(e) {
      if (e) e.preventDefault();
      let val = input.value.trim();
      if (!val) return;

      status.innerText = "Connecting via mirror...";

      let targetUrl = val;
      if (!val.startsWith('http://') && !val.startsWith('https://')) {
        if (val.includes('.') && !val.includes(' ')) {
          targetUrl = 'https://' + val;
        } else {
          targetUrl = 'https://www.google.com/search?q=' + encodeURIComponent(val);
        }
      }

      tryNextGateway(targetUrl);
    }

    function tryNextGateway(targetUrl) {
      if (currentGatewayIndex >= gateways.length) {
        status.innerText = "All 25 gateways failed. Try again later.";
        return;
      }

      const activeGateway = gateways[currentGatewayIndex];
      status.innerText = `Trying mirror ${currentGatewayIndex + 1}/25...`;
      
      frame.src = activeGateway + btoa(targetUrl);

      frame.onload = () => {
        status.innerText = `Connected (Mirror ${currentGatewayIndex + 1})`;
      };
      
      frame.onerror = () => {
        currentGatewayIndex++;
        tryNextGateway(targetUrl);
      };
    }
  </script>

</body>
</html>
