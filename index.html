<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browser Hub - S++++ Tier Edition</title>
  <script src="https://cdn.jsdelivr.net/npm/@titaniumnetwork-dev/ultraviolet@3.2.7/dist/uv.bundle.js"></script>
  
  <script>
    // GitHub Pages Base Path Resolution
    const pathSegments = window.location.pathname.split('/').filter(Boolean);
    const repoSubpath = (window.location.hostname.includes('github.io') && pathSegments.length > 0) 
      ? '/' + pathSegments[0] + '/' 
      : '/';

    window.__uv$config = {
      prefix: repoSubpath + 'uv/service/',
      bare: 'https://bare-server-y5ch.onrender.com/bare/',
      encodeUrl: Ultraviolet.codec.xor.encode,
      decodeUrl: Ultraviolet.codec.xor.decode,
      handler: 'https://cdn.jsdelivr.net/npm/@titaniumnetwork-dev/ultraviolet@3.2.7/dist/uv.handler.js',
      client: 'https://cdn.jsdelivr.net/npm/@titaniumnetwork-dev/ultraviolet@3.2.7/dist/uv.client.js',
      bundle: 'https://cdn.jsdelivr.net/npm/@titaniumnetwork-dev/ultraviolet@3.2.7/dist/uv.bundle.js',
      config: repoSubpath + 'uv.config.js',
      sw: repoSubpath + 'sw.js',
    };
  </script>

  <style>
    :root {
      --bg-primary: #0a0c10;
      --bg-secondary: #161b22;
      --bg-tertiary: #21262d;
      --accent: #2f81f7;
      --text-main: #f0f6fc;
      --text-muted: #8b949e;
      --border: #30363d;
      --border-hover: #8b949e;
      --status-green: #3fb950;
      --status-yellow: #d29922;
      --status-red: #ff7b72;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    html, body {
      width: 100%;
      height: 100%;
      background: var(--bg-primary);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--text-main);
      overflow: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    /* ANTI-NESTING RULE: Completely hides navigation UI if loaded inside itself */
    .is-nested #browser-header { display: none !important; }
    .is-nested #viewport-container { height: 100vh !important; }

    /* --- BROWSER HEADER & TABS --- */
    #browser-header {
      background: var(--bg-primary);
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      user-select: none;
    }

    #tab-bar {
      display: flex;
      align-items: center;
      background: #010409;
      padding: 6px 8px 0 8px;
      gap: 4px;
      overflow-x: auto;
    }

    .tab {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-bottom: none;
      padding: 6px 12px;
      border-radius: 8px 8px 0 0;
      font-size: 12px;
      color: var(--text-muted);
      cursor: pointer;
      max-width: 180px;
      min-width: 100px;
      transition: all 0.15s ease;
    }

    .tab.active {
      background: var(--bg-secondary);
      color: var(--text-main);
      border-color: var(--border);
      border-bottom: 2px solid var(--accent);
      font-weight: 600;
    }

    .tab-title {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex-grow: 1;
    }

    .tab-close {
      border-radius: 50%;
      width: 14px;
      height: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
    }

    .tab-close:hover {
      background: rgba(255, 255, 255, 0.2);
      color: var(--status-red);
    }

    #new-tab-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 16px;
      padding: 4px 10px;
      cursor: pointer;
      border-radius: 4px;
    }

    #new-tab-btn:hover { background: var(--bg-tertiary); color: var(--text-main); }

    /* --- NAVIGATION BAR --- */
    #nav-bar {
      background: var(--bg-secondary);
      padding: 8px 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      border-top: 1px solid var(--border);
    }

    .nav-btn {
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      color: var(--text-main);
      width: 32px;
      height: 32px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      transition: background 0.15s, border-color 0.15s;
    }

    .nav-btn:hover { background: var(--border); border-color: var(--border-hover); }

    #omnibox-form {
      flex-grow: 1;
      display: flex;
    }

    #omnibox {
      width: 100%;
      height: 32px;
      padding: 0 12px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--bg-primary);
      color: var(--text-main);
      outline: none;
      font-size: 13px;
      transition: all 0.15s ease;
    }

    #omnibox:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(47, 129, 247, 0.2);
    }

    #status-badge {
      font-size: 11px;
      font-weight: 600;
      padding: 4px 8px;
      border-radius: 12px;
      background: var(--bg-primary);
      border: 1px solid var(--border);
      color: var(--text-muted);
      white-space: nowrap;
    }

    /* --- QUICK LAUNCH BOOKMARKS BAR --- */
    #bookmarks-bar {
      background: var(--bg-secondary);
      padding: 4px 12px 8px 12px;
      display: flex;
      gap: 6px;
      overflow-x: auto;
      border-bottom: 1px solid var(--border);
    }

    .bookmark-chip {
      background: var(--bg-primary);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 3px 10px;
      border-radius: 12px;
      font-size: 11px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s;
    }

    .bookmark-chip:hover {
      color: var(--text-main);
      border-color: var(--accent);
      background: var(--bg-tertiary);
    }

    /* --- VIEWPORT CONTAINER --- */
    #viewport-container {
      flex-grow: 1;
      width: 100%;
      position: relative;
      background: #ffffff;
    }

    .tab-frame {
      width: 100%;
      height: 100%;
      border: none;
      display: none;
      background: #ffffff;
    }

    .tab-frame.active {
      display: block;
    }
  </style>
</head>
<body>

  <div id="browser-header">
    <div id="tab-bar">
      <div id="tabs-wrapper" style="display:flex; gap:4px;"></div>
      <button id="new-tab-btn" onclick="createNewTab()" title="New Tab">+</button>
    </div>

    <div id="nav-bar">
      <button class="nav-btn" onclick="activeTabGoBack()" title="Back">&#8592;</button>
      <button class="nav-btn" onclick="activeTabGoForward()" title="Forward">&#8594;</button>
      <button class="nav-btn" onclick="activeTabReload()" title="Reload">&#8635;</button>
      
      <form id="omnibox-form" onsubmit="handleSearch(event)">
        <input type="text" id="omnibox" placeholder="Search with Google or enter URL..." autocomplete="off">
      </form>

      <div id="status-badge">Initializing Engine...</div>
    </div>

    <div id="bookmarks-bar">
      <div class="bookmark-chip" onclick="quickNavigate('https://google.com')">Google</div>
      <div class="bookmark-chip" onclick="quickNavigate('https://youtube.com')">YouTube</div>
      <div class="bookmark-chip" onclick="quickNavigate('https://discord.com')">Discord</div>
      <div class="bookmark-chip" onclick="quickNavigate('https://wikipedia.org')">Wikipedia</div>
      <div class="bookmark-chip" onclick="quickNavigate('https://github.com')">GitHub</div>
      <div class="bookmark-chip" onclick="quickNavigate('https://reddit.com')">Reddit</div>
    </div>
  </div>

  <div id="viewport-container"></div>

  <script>
    // ==========================================
    // 1. SMART ANTI-NESTING / ANTI-STACKING LOCK
    // ==========================================
    try {
      if (window.self !== window.top) {
        // If parent domain matches ours, we are nesting inside ourselves! Hide header.
        if (window.parent.location.hostname === window.location.hostname) {
          document.body.classList.add('is-nested');
        }
      }
    } catch (e) {
      // Cross-origin context (e.g. Google Sites embed) -> Allow normal UI!
    }

    // ==========================================
    // 2. HYDRA NETWORK BARE ENDPOINTS (20 Node Pool)
    // ==========================================
    const bareNetwork = [
      'https://bare-server-y5ch.onrender.com/bare/',
      'https://tomp.app/bare/',
      'https://bare.benrovers.noc.st/bare/',
      'https://b.tomp.app/bare/',
      'https://solar-1.benrovers.noc.st/bare/',
      'https://c.tomp.app/bare/',
      'https://lunar-1.benrovers.noc.st/bare/',
      'https://bare.starlightproxy.com/bare/',
      'https://flowos-bare.onrender.com/bare/',
      'https://bare.mathstudy.app/bare/',
      'https://bare.z1g.top/bare/',
      'https://d.tomp.app/bare/',
      'https://bare.titaniumnetwork.org/bare/',
      'https://e.tomp.app/bare/',
      'https://bare-server.mathstudy.app/bare/'
    ];

    let activeBareIndex = 0;
    let tabs = [];
    let activeTabId = null;

    const statusBadge = document.getElementById('status-badge');
    const omnibox = document.getElementById('omnibox');
    const tabsWrapper = document.getElementById('tabs-wrapper');
    const viewportContainer = document.getElementById('viewport-container');

    // Init Service Worker
    async function initWorker() {
      if ('serviceWorker' in navigator) {
        try {
          await navigator.serviceWorker.register(window.__uv$config.sw, { scope: window.__uv$config.prefix });
          await navigator.serviceWorker.ready;
          updateStatus("Engine Ready", "--status-green");
        } catch (e) {
          updateStatus("SW Offline", "--status-yellow");
        }
      }
    }
    initWorker();

    function updateStatus(text, cssVarColor) {
      statusBadge.innerText = text;
      statusBadge.style.color = `var(${cssVarColor})`;
    }

    // ==========================================
    // 3. MULTI-TAB CONTROLLER
    // ==========================================
    function createNewTab(initialUrl = '') {
      const tabId = 'tab-' + Math.random().toString(36).substr(2, 9);
      
      const frame = document.createElement('iframe');
      frame.className = 'tab-frame';
      frame.id = 'frame-' + tabId;
      viewportContainer.appendChild(frame);

      const tabData = { id: tabId, title: 'New Tab', url: initialUrl, frame: frame };
      tabs.push(tabData);

      switchTab(tabId);

      if (initialUrl) {
        navigateTab(tabData, initialUrl);
      }
    }

    function switchTab(tabId) {
      activeTabId = tabId;
      tabs.forEach(t => {
        const isCurrent = t.id === tabId;
        t.frame.classList.toggle('active', isCurrent);
      });
      renderTabs();
      
      const currentTab = tabs.find(t => t.id === tabId);
      omnibox.value = currentTab && currentTab.url ? currentTab.url : '';
    }

    function closeTab(tabId, event) {
      if (event) event.stopPropagation();
      if (tabs.length === 1) return; // Keep at least 1 tab open

      const index = tabs.findIndex(t => t.id === tabId);
      const tabData = tabs[index];
      
      tabData.frame.remove();
      tabs.splice(index, 1);

      if (activeTabId === tabId) {
        const nextTab = tabs[Math.max(0, index - 1)];
        switchTab(nextTab.id);
      } else {
        renderTabs();
      }
    }

    function renderTabs() {
      tabsWrapper.innerHTML = '';
      tabs.forEach(t => {
        const el = document.createElement('div');
        el.className = `tab ${t.id === activeTabId ? 'active' : ''}`;
        el.onclick = () => switchTab(t.id);

        const titleSpan = document.createElement('span');
        titleSpan.className = 'tab-title';
        titleSpan.innerText = t.title || 'New Tab';

        const closeBtn = document.createElement('span');
        closeBtn.className = 'tab-close';
        closeBtn.innerHTML = '&times;';
        closeBtn.onclick = (e) => closeTab(t.id, e);

        el.appendChild(titleSpan);
        el.appendChild(closeBtn);
        tabsWrapper.appendChild(el);
      });
    }

    // ==========================================
    // 4. NAVIGATION & PROXY ENGINE
    // ==========================================
    function handleSearch(e) {
      if (e) e.preventDefault();
      const query = omnibox.value.trim();
      if (!query) return;

      let targetUrl = query;
      if (!query.startsWith('http://') && !query.startsWith('https://')) {
        if (query.includes('.') && !query.includes(' ')) {
          targetUrl = 'https://' + query;
        } else {
          targetUrl = 'https://www.google.com/search?q=' + encodeURIComponent(query);
        }
      }

      const currentTab = tabs.find(t => t.id === activeTabId);
      if (currentTab) {
        navigateTab(currentTab, targetUrl);
      }
    }

    function quickNavigate(url) {
      omnibox.value = url;
      handleSearch();
    }

    async function navigateTab(tabData, url) {
      tabData.url = url;
      tabData.title = url.replace('https://', '').replace('www.', '').split('/')[0];
      renderTabs();

      activeBareIndex = 0; // Always start with primary private server
      executeProxyRoute(tabData, url);
    }

    async function executeProxyRoute(tabData, targetUrl) {
      if (activeBareIndex >= bareNetwork.length) {
        updateStatus("All Nodes Failed", "--status-red");
        return;
      }

      const currentEndpoint = bareNetwork[activeBareIndex];
      window.__uv$config.bare = currentEndpoint;

      if (activeBareIndex === 0) {
        updateStatus("Waking Private Server...", "--status-yellow");
        try { await fetch(currentEndpoint, { method: 'GET', mode: 'no-cors' }).catch(() => {}); } catch(e){}
      } else {
        updateStatus(`Fallback Node ${activeBareIndex + 1}`, "--status-yellow");
      }

      try {
        const encodedUrl = Ultraviolet.codec.xor.encode(targetUrl);
        tabData.frame.src = window.__uv$config.prefix + encodedUrl;
        
        updateStatus(activeBareIndex === 0 ? "Connected (Private)" : `Connected (Node ${activeBareIndex + 1})`, "--status-green");
      } catch (err) {
        activeBareIndex++;
        executeProxyRoute(tabData, targetUrl);
      }
    }

    function activeTabGoBack() {
      const cur = tabs.find(t => t.id === activeTabId);
      if (cur) try { cur.frame.contentWindow.history.back(); } catch(e){}
    }

    function activeTabGoForward() {
      const cur = tabs.find(t => t.id === activeTabId);
      if (cur) try { cur.frame.contentWindow.history.forward(); } catch(e){}
    }

    function activeTabReload() {
      const cur = tabs.find(t => t.id === activeTabId);
      if (cur) try { cur.frame.contentWindow.location.reload(); } catch(e){}
    }

    // Initialize first default tab
    createNewTab();
  </script>
</body>
</html>
