  <!-- uv.config.js is required for the local service worker -->

      display: flex;
      flex-direction: column;
      height: 100vh;
      background: #0f1117;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #f0f6fc;
      overflow: hidden;
    }
    #top-bar {
      background: #161b22;

      align-items: center;
      gap: 15px;
      border-bottom: 1px solid #30363d;
      flex-shrink: 0;
    }
    h1 {
      margin: 0;
      font-size: 18px;
      color: #58a6ff;
      font-weight: 600;
    }
    #search-form {
      flex-grow: 1;
      max-width: 600px;
      display: flex;
    }
    input {
      width: 100%;
      padding: 8px 14px;
      border-radius: 6px;
      border: 1px solid #30363d;
      background: #0d1117;
      color: #f0f6fc;
      font-size: 14px;
      outline: none;
    }
    input:focus {
      border-color: #58a6ff;
    }
    #status {
      font-size: 12px;
      color: #8b949e;
      margin-left: auto;
    }
    iframe {
      flex-grow: 1;
      border: none;
      width: 100%;
      height: 100%;
      background: #ffffff;
    }
  </style>
</head>
<body>

    <h1>Proxy</h1>
    <form id="search-form" onsubmit="loadURL(event)">
      <input type="text" id="url-input" placeholder="Type a website URL or search query..." autocomplete="off" autofocus>
    </form>
    <div id="status">Ready</div>
  </div>

  <iframe id="proxy-frame"></iframe>

    ];

    let currentGatewayIndex = 0;
    let currentTargetUrl = "";

    async function loadURL(e) {
      if (e) e.preventDefault();
      let val = input.value.trim();
      if (!val) return;

      status.innerText = "Encoding URL...";
      
      // Format Search vs Direct URL
      if (!val.includes('.') || val.includes(' ')) {
        val = 'https://www.google.com/search?q=' + encodeURIComponent(val);
      } else if (!val.startsWith('http')) {
        val = 'https://' + val;
      }
      
      currentTargetUrl = val;

      try {
        // STEP 1: Try to register and use the local Service Worker first (Best Performance)
        if (typeof __uv$config !== 'undefined' && 'serviceWorker' in navigator) {
          await navigator.serviceWorker.register('/sw.js', { scope: __uv$config.prefix });
          status.innerText = "Connected via Local Service Worker";
          frame.src = __uv$config.prefix + __uv$config.encodeUrl(currentTargetUrl);
        } else {
          throw new Error("Local UV config not found.");
        }
      } catch (err) {
        // STEP 2: Fallback to the 100 Backup Gateways if local SW fails (GitHub Pages safety net)
        console.warn("Local Service Worker failed, falling back to external gateways...", err);
        currentGatewayIndex = 0;
        tryNextGateway();
      }
    }

    function tryNextGateway() {
      if (currentGatewayIndex >= gateways.length) {
        status.innerText = "Critical Error: All 100 gateways failed.";
        return;
      }

      status.innerText = `Local SW failed. Trying backup ${currentGatewayIndex + 1}/100...`;

      try {
        // Encode using Ultraviolet's raw XOR codec
        const encoded = Ultraviolet.codec.xor.encode(currentTargetUrl);
        const activeGateway = gateways[currentGatewayIndex];

        frame.src = activeGateway + encoded;

        frame.onload = () => {
          status.innerText = `Connected via Backup Gateway ${currentGatewayIndex + 1}`;
        };

        frame.onerror = () => {
          currentGatewayIndex++;
          tryNextGateway();
        };
      } catch (err) {
        status.innerText = "Encoding failed. Check URL formatting.";
      }
    }
  </script>
