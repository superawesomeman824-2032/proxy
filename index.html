<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Proxy Hub</title>
  <script src="https://cdn.jsdelivr.net/npm/@titaniumnetwork-dev/ultraviolet@3.2.7/dist/uv.bundle.js"></script>
  <script src="/uv.config.js"></script>
  <style>
    body { margin: 0; background: #0f1117; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; }
    #top-bar { padding: 12px; background: #161b22; display: flex; gap: 10px; }
    input { flex-grow: 1; padding: 8px; border-radius: 6px; border: 1px solid #30363d; background: #0d1117; color: #fff; }
    iframe { flex-grow: 1; border: none; background: #fff; }
  </style>
</head>
<body>
  <div id="top-bar">
    <form id="form" style="display:flex; width:100%;" onsubmit="loadURL(event)">
      <input type="text" id="url" placeholder="Search or enter URL..." autocomplete="off">
    </form>
  </div>
  <iframe id="frame"></iframe>

  <script>
    async function loadURL(e) {
      e.preventDefault();
      let val = document.getElementById('url').value.trim();
      if (!val) return;

      if (!val.includes('.') || val.includes(' ')) {
        val = 'https://www.google.com/search?q=' + encodeURIComponent(val);
      } else if (!val.startsWith('http')) {
        val = 'https://' + val;
      }

      // Register the service worker properly
      try {
        await navigator.serviceWorker.register('/sw.js', { scope: __uv$config.prefix });
        
        // Let the service worker intercept the encoded path
        document.getElementById('frame').src = __uv$config.prefix + __uv$config.encodeUrl(val);
      } catch (err) {
        console.error("Service worker failed to register:", err);
        alert("Failed to register proxy worker.");
      }
    }
  </script>
</body>
</html>
