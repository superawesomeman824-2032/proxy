  <script src="https://cdn.jsdelivr.net/npm/@titaniumnetwork-dev/ultraviolet@3.2.7/dist/uv.bundle.js"></script>
  <script src="/uv.config.js"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      background: #0f1117;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #f0f6fc;
      overflow: hidden;
    }
    #top-bar {
      background: #161b22;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 15px;
      border-bottom: 1px solid #30363d;
      flex-shrink: 0;
    }
    h1 {
      margin: 0;
      font-size: 18px;
      color: #58a6ff;
      font-weight: 600;
    }
    #search-form {
      flex-grow: 1;
      max-width: 600px;
    }
    input {
      width: 100%;
      padding: 8px 14px;
      border-radius: 6px;
      border: 1px solid #30363d;
      background: #0d1117;
      color: #f0f6fc;
      font-size: 14px;
      outline: none;
    }
    input:focus {
      border-color: #58a6ff;
    }
    #status {
      font-size: 12px;
      color: #8b949e;
      margin-left: auto;
    }
    iframe {
      flex-grow: 1;
      border: none;
      width: 100%;
      height: 100%;
      background: #ffffff;
    }
  </style>
</head>
<body>

  <div id="top-bar">
    <h1>Proxy</h1>
    <form id="search-form" onsubmit="loadURL(event)">
      <input type="text" id="url-input" placeholder="Type a website URL or search query..." autocomplete="off" autofocus>
    </form>
    <div id="status">Ready</div>
  </div>

  <iframe id="proxy-frame"></iframe>

        registrations.forEach(reg => reg.unregister());

    const frame = document.getElementById('proxy-frame');
    const status = document.getElementById('status');

      'https://pearl-proxy.vercel.app/service/',
      'https://garnet-proxy.netlify.app/service/'
    ];

    let currentGatewayIndex = 0;
    let currentTargetUrl = "";

    async function loadURL(e) {
      if (e) e.preventDefault();
      let val = input.value.trim();
      if (!val) return;

      status.innerText = "Processing URL...";
      currentGatewayIndex = 0;

      let targetUrl = val;
      if (!val.startsWith('http://') && !val.startsWith('https://')) {
        targetUrl = val.includes('.') && !val.includes(' ') ? 'https://' + val : 'https://www.google.com/search?q=' + encodeURIComponent(val);
      }

      currentTargetUrl = targetUrl;

      if ('serviceWorker' in navigator) {
        try {
          await navigator.serviceWorker.register('/sw.js', { scope: __uv$config.prefix });
        } catch (err) {
          console.warn("SW warning:", err);
        }
      }

      tryNextGateway();
    }

    async function tryNextGateway() {
      if (currentGatewayIndex >= gateways.length) {
        status.innerText = "Critical Error: All gateways failed.";
        return;
      }

      const activeGateway = gateways[currentGatewayIndex];
      status.innerText = activeGateway === 'local' ? "Connecting local..." : `Trying mirror ${currentGatewayIndex}...`;

      try {
        const encoded = Ultraviolet.codec.xor.encode(currentTargetUrl);
        let targetSrc = activeGateway === 'local' ? __uv$config.prefix + encoded : activeGateway + encoded;

        if (activeGateway !== 'local') {
           try {
               await fetch(activeGateway, { mode: 'no-cors', cache: 'no-store' });
           } catch (fetchErr) {
               currentGatewayIndex++;
               return tryNextGateway();
           }
        }

        frame.src = targetSrc;
        frame.onload = () => { status.innerText = "Connected"; };
        frame.onerror = () => { currentGatewayIndex++; tryNextGateway(); };
      } catch (err) {
        currentGatewayIndex++;
        tryNextGateway();
      }
    }
  </script>
</body>
